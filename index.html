<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>[hidden]{display:none!important}</style>
<title>Gridiron Akademi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column phone app, bottom tab bar, game objects with 2px ink outlines and hard shadows. Tokens come from the Gridiron Akademi design system. */
:root{
  --surface-100:#f4f1e8;--surface-200:#ffffff;--surface-300:#e6e2d3;
  --ink:#10241a;--ink-muted:#4a5b51;--line:#cfc9b5;--line-strong:#6b7a70;--focus:#0b57d0;
  --turf:#1f6b43;--on-turf:#ffffff;--turf-soft:#dcebe1;
  --flag:#f2b705;--on-flag:#1b1400;
  --correct:#0a6c8f;--on-correct:#ffffff;--correct-soft:#d9eef6;
  --wrong:#b33a00;--on-wrong:#ffffff;--wrong-soft:#fbe3d6;
  --r-common:#5c665e;--on-r-common:#ffffff;--r-rare:#17608f;--on-r-rare:#ffffff;--r-epic:#8a2f6f;--on-r-epic:#ffffff;--r-legend:#f2b705;--on-r-legend:#1b1400;
  --board:#10241a;--on-board:#f2efe4;--on-board-dim:#a9b8ad;
  --shadow-chunk:0 4px 0 0 rgba(16,36,26,.35);--shadow-card:0 6px 16px 0 rgba(16,36,26,.16);
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;--font-sans:"Barlow",system-ui,sans-serif;
  --radius-sm:6px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface-100:#0e1a14;--surface-200:#16271e;--surface-300:#0a120e;
  --ink:#f2efe4;--ink-muted:#a9b8ad;--line:#2a4033;--line-strong:#7f917f;--focus:#8ab4ff;
  --turf:#3fbf7f;--on-turf:#05180e;--turf-soft:#1c3a2b;
  --flag:#ffd23f;--on-flag:#1b1400;
  --correct:#6fd0f5;--on-correct:#021821;--correct-soft:#0f3340;
  --wrong:#ff9966;--on-wrong:#2a0d00;--wrong-soft:#4a2210;
  --r-common:#aab5ac;--on-r-common:#0e1a14;--r-rare:#6cb8ee;--on-r-rare:#04121d;--r-epic:#e58ac8;--on-r-epic:#2a0a20;--r-legend:#ffd23f;--on-r-legend:#1b1400;
  --board:#050c08;
  --shadow-chunk:0 4px 0 0 rgba(0,0,0,.6);--shadow-card:0 6px 16px 0 rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --surface-100:#0e1a14;--surface-200:#16271e;--surface-300:#0a120e;
  --ink:#f2efe4;--ink-muted:#a9b8ad;--line:#2a4033;--line-strong:#7f917f;--focus:#8ab4ff;
  --turf:#3fbf7f;--on-turf:#05180e;--turf-soft:#1c3a2b;
  --flag:#ffd23f;--on-flag:#1b1400;
  --correct:#6fd0f5;--on-correct:#021821;--correct-soft:#0f3340;
  --wrong:#ff9966;--on-wrong:#2a0d00;--wrong-soft:#4a2210;
  --r-common:#aab5ac;--on-r-common:#0e1a14;--r-rare:#6cb8ee;--on-r-rare:#04121d;--r-epic:#e58ac8;--on-r-epic:#2a0a20;--r-legend:#ffd23f;--on-r-legend:#1b1400;
  --board:#050c08;
  --shadow-chunk:0 4px 0 0 rgba(0,0,0,.6);--shadow-card:0 6px 16px 0 rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface-100);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:16px 0}
main{flex:1;display:flex;flex-direction:column;gap:20px;padding-bottom:104px;min-width:0}
h1,h2,h3,p{margin:0}
.h-display{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:40px;text-wrap:balance}
.h-md{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:30px;text-wrap:balance}
.eyebrow{font-weight:600;font-size:12px;line-height:16px;letter-spacing:.04em;color:var(--ink-muted)}
.muted{color:var(--ink-muted)}
.sm{font-size:14px;line-height:20px}

/* Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border:2px solid var(--ink);border-radius:var(--radius-md);font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1;cursor:pointer;box-shadow:var(--shadow-chunk);background:var(--surface-200);color:var(--ink)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.btn--primary{background:var(--turf);color:var(--on-turf)}
.btn--flag{background:var(--flag);color:var(--on-flag)}
.btn--ghost{background:transparent;color:var(--turf);border-color:transparent;box-shadow:none}
.btn--block{width:100%;min-height:56px;font-size:22px}
.btn:disabled{background:var(--surface-300);color:var(--ink-muted);border-color:var(--line-strong);box-shadow:none;cursor:not-allowed}
.glyph{flex:none}

/* XP */
.xp{display:flex;flex-direction:column;gap:8px}
.xp__head{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.xp__level{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-display);font-weight:700;font-size:20px;line-height:24px}
.xp__nums{font-family:var(--font-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;color:var(--ink-muted)}
.xp__track{height:18px;border:2px solid var(--ink);border-radius:var(--radius-pill);background:var(--surface-300);overflow:hidden}
.xp__fill{height:100%;background:var(--turf);transition:width .4s}
@media (prefers-reduced-motion:reduce){.xp__fill{transition:none}}

/* Tray */
.tray{display:flex;gap:12px;flex-wrap:wrap}
.tray__item{flex:1 1 140px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border:2px solid var(--ink);border-radius:var(--radius-md);background:var(--surface-200)}
.tray__item b{font-family:var(--font-display);font-size:22px;line-height:24px;display:block}
.tray__item .btn{min-height:40px;padding:0 16px;font-size:18px}

/* Lessons */
.lessons{display:flex;flex-direction:column;gap:12px;padding:0;margin:0;list-style:none}
.lesson{display:flex;gap:12px;align-items:center;width:100%;padding:12px;border:2px solid var(--ink);border-radius:var(--radius-md);background:var(--surface-200);text-align:left;cursor:pointer;box-shadow:var(--shadow-chunk)}
.lesson:disabled{border-style:dashed;border-color:var(--line-strong);box-shadow:none;cursor:not-allowed;color:var(--ink-muted)}
.lesson__n{flex:none;display:grid;place-items:center;width:48px;height:48px;border:2px solid var(--ink);border-radius:var(--radius-pill);background:var(--flag);color:var(--on-flag);font-family:var(--font-display);font-weight:800;font-size:24px}
.lesson:disabled .lesson__n{background:var(--surface-300);color:var(--ink-muted);border-style:dashed;border-color:var(--line-strong)}
.lesson.is-done .lesson__n{background:var(--turf);color:var(--on-turf)}
.lesson__t{flex:1;min-width:0}
.lesson__t strong{display:block;font-family:var(--font-display);font-weight:700;font-size:22px;line-height:24px}
.lesson__state{flex:none;font-weight:700;font-size:13px;line-height:16px;text-align:right}

/* Board */
.board{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:16px;border:2px solid var(--ink);border-radius:var(--radius-md);background:var(--board);color:var(--on-board)}
.board__main{display:flex;flex-direction:column;min-width:110px}
.board__dd{font-family:var(--font-display);font-weight:700;font-size:48px;line-height:48px;color:var(--flag);font-variant-numeric:tabular-nums}
.board__ball{font-size:14px;line-height:20px;color:var(--on-board-dim)}
.board__clock{display:flex;flex-direction:column;align-items:center}
.board__q{font-weight:600;font-size:12px;line-height:16px;letter-spacing:.04em;color:var(--on-board-dim)}
.board__time{font-family:var(--font-display);font-weight:700;font-size:36px;line-height:38px;font-variant-numeric:tabular-nums}
.board__teams{display:flex;gap:24px;margin-left:auto}
.team{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
.team__name{font-weight:600;font-size:14px;line-height:20px}
.team__score{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:40px;font-variant-numeric:tabular-nums}
.team__dots{display:inline-flex;gap:4px;margin-top:4px}
.team__dot{width:10px;height:10px;border:2px solid var(--on-board-dim);border-radius:var(--radius-pill)}
.team__dot.on{background:var(--flag);border-color:var(--flag)}
.team__tag{font-weight:600;font-size:12px;line-height:16px;letter-spacing:.04em;color:var(--flag)}

/* Quiz */
.qhead{display:flex;align-items:center;gap:12px}
.qdots{flex:1;display:flex;gap:6px}
.qdot{flex:1;height:10px;border:2px solid var(--ink);border-radius:var(--radius-pill);background:var(--surface-300)}
.qdot.cur{background:var(--flag)}
.qdot.ok{background:var(--correct)}
.qdot.no{background:var(--wrong)}
.qtext{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:30px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:12px}
.ans{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px;border:2px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface-200);color:var(--ink);font-size:16px;line-height:24px;text-align:left;cursor:pointer}
.ans__key{display:grid;place-items:center;flex:none;width:32px;height:32px;border:2px solid var(--ink);border-radius:var(--radius-sm);background:var(--surface-100);font-family:var(--font-display);font-weight:700;font-size:18px}
.ans__text{flex:1;min-width:0}
.ans__status{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px}
.ans.correct{border:3px solid var(--correct);background:var(--correct-soft);cursor:default}
.ans.correct .ans__status{color:var(--correct)}
.ans.wrong{border:3px solid var(--wrong);background:var(--wrong-soft);cursor:default}
.ans.wrong .ans__status{color:var(--wrong)}
.ans.dim{background:var(--surface-300);color:var(--ink-muted);cursor:default}
.fb{padding:16px;border:2px solid var(--ink);border-radius:var(--radius-md);background:var(--surface-200);display:flex;flex-direction:column;gap:8px}
.fb__t{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:30px;display:flex;align-items:center;gap:8px}
.fb.ok .fb__t{color:var(--correct)}
.fb.no .fb__t{color:var(--wrong)}
.fb__src{font-size:12px;line-height:16px;color:var(--ink-muted)}

/* Term chip */
.term{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:4px 14px;border:2px solid var(--line-strong);border-radius:var(--radius-pill);background:var(--surface-200);cursor:pointer}
.term--solo{background:var(--surface-300);border-color:transparent;cursor:default}
.term__en{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:24px}
.term__hint{padding:2px 6px;border-radius:var(--radius-sm);background:var(--surface-300);font-weight:700;font-size:11px;line-height:14px;letter-spacing:.04em;color:var(--ink-muted)}
.term__tr{font-size:15px;line-height:20px}
.term.open{border-color:var(--turf);background:var(--turf-soft)}
.terms{display:flex;flex-wrap:wrap;gap:8px}

/* Penalty flag */
.flagcard{display:flex;align-items:flex-start;gap:12px;padding:12px;border:2px solid var(--ink);border-radius:var(--radius-md);background:var(--surface-200);box-shadow:var(--shadow-chunk)}
.flagcard__icon{display:grid;place-items:center;flex:none;width:48px;height:48px;border:2px solid var(--ink);border-radius:var(--radius-pill);background:var(--flag);color:var(--on-flag)}
.flagcard__text{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.flagcard__name{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:28px}
.pill{padding:2px 10px;border-radius:var(--radius-pill);background:var(--surface-300);font-weight:600;font-size:13px;line-height:20px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.flagcard__src{font-size:12px;line-height:16px;color:var(--ink-muted)}
.flagcard__yards{display:flex;flex-direction:column;align-items:center;flex:none;min-width:52px}
.flagcard__yards b{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:44px}
.flagcard__yards small{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.list{display:flex;flex-direction:column;gap:16px}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
.pcard{--rar:var(--r-common);--on-rar:var(--on-r-common);width:100%;max-width:200px;border:2px solid var(--ink);border-radius:var(--radius-md);background:var(--surface-200);overflow:hidden;box-shadow:var(--shadow-chunk)}
.pcard.rare{--rar:var(--r-rare);--on-rar:var(--on-r-rare)}
.pcard.epic{--rar:var(--r-epic);--on-rar:var(--on-r-epic)}
.pcard.legend{--rar:var(--r-legend);--on-rar:var(--on-r-legend)}
.pcard__top{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--rar);color:var(--on-rar);font-family:var(--font-display);font-weight:700;font-size:15px;line-height:16px;letter-spacing:.04em}
.pcard__stars{display:inline-flex;gap:2px}
.pcard__art{position:relative;height:96px;display:grid;place-items:center;background:var(--surface-300);overflow:hidden}
.pcard__field{position:absolute;inset:0;width:100%;height:100%}
.pcard__field line{stroke:var(--line-strong);stroke-width:1}
.pcard__pos{position:relative;font-family:var(--font-display);font-weight:800;font-size:52px;line-height:1}
.pcard__num{position:absolute;right:8px;bottom:6px;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink-muted)}
.pcard__dup{position:absolute;left:8px;bottom:6px;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink-muted)}
.pcard__body{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px}
.pcard__name{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:24px}
.pcard__concept{font-size:13px;line-height:18px;color:var(--ink-muted)}
.pcard.locked{border-style:dashed;border-color:var(--line-strong);box-shadow:none}
.pcard.locked .pcard__top{background:var(--surface-300);color:var(--ink-muted)}
.pcard.locked .pcard__pos{color:var(--ink-muted)}

/* Pack */
.pack{--pk:var(--turf);display:inline-flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pack.playbook{--pk:var(--r-rare)}
.pack__body{position:relative;display:grid;place-items:center;width:150px;height:190px;border:3px solid var(--ink);border-radius:var(--radius-lg);background:var(--surface-200);overflow:hidden;box-shadow:var(--shadow-chunk)}
.pack__band{position:absolute;left:0;right:0;top:0;height:44px;background:var(--pk);border-bottom:3px solid var(--ink)}
.pack__body .glyph{margin-top:36px}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.pack.opening .pack__body{animation:shake .45s infinite}
@media (prefers-reduced-motion:reduce){.pack.opening .pack__body{animation:none}}
.stage{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding-top:8px}
.stage .pcard{max-width:220px}
.reveal{padding:16px;border:2px solid var(--ink);border-radius:var(--radius-lg);background:var(--surface-200);box-shadow:var(--shadow-card);width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}

/* Badge */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px 12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.badge__disc{display:grid;place-items:center;width:72px;height:72px;border:3px solid var(--ink);border-radius:var(--radius-pill);margin-bottom:4px}
.badge.earned .badge__disc{background:var(--flag);color:var(--on-flag);box-shadow:var(--shadow-chunk)}
.badge.locked .badge__disc{background:var(--surface-300);color:var(--ink-muted);border-style:dashed;border-color:var(--line-strong)}
.badge__title{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:22px}
.badge__state{font-weight:600;font-size:12px;line-height:16px;letter-spacing:.04em;color:var(--ink-muted)}
.badge.earned .badge__state{color:var(--turf)}
.badge__desc{font-size:13px;line-height:18px;color:var(--ink-muted)}

/* Result */
.score{font-family:var(--font-display);font-weight:800;font-size:64px;line-height:60px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.stat{padding:12px;border:2px solid var(--ink);border-radius:var(--radius-md);background:var(--surface-200);display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-display);font-size:32px;line-height:32px;font-variant-numeric:tabular-nums}
.banner{padding:12px 16px;border:2px solid var(--ink);border-radius:var(--radius-md);background:var(--flag);color:var(--on-flag);font-family:var(--font-display);font-weight:700;font-size:22px;line-height:26px;width:100%}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--surface-200);border-top:2px solid var(--ink);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs__in{display:flex;gap:4px;width:100%;max-width:520px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;padding:6px 4px;border:0;background:transparent;cursor:pointer;color:var(--ink-muted);font-weight:600;font-size:13px;line-height:16px}
.tab[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -4px 0 var(--turf)}
.tabs[hidden]{display:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:2px solid var(--ink);border-radius:var(--radius-pill);background:var(--surface-200);font-weight:600;font-size:14px;line-height:20px}
.sep{height:2px;background:var(--line);border:0;width:100%;margin:0}

/* Sticker album */
.pcard__full{font-size:12px;line-height:16px;color:var(--ink-muted)}
.pcard__stars{display:inline-flex;gap:2px;margin-top:4px;color:var(--ink)}
.pcard.foil{border-color:var(--flag);border-width:4px;box-shadow:0 0 0 2px var(--ink),var(--shadow-chunk)}
.pcard.foil .pcard__top{letter-spacing:.06em}
.revgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px 16px;width:100%;justify-items:center}
.rv{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:200px}
.tag{padding:2px 10px;border:2px solid var(--ink);border-radius:var(--radius-pill);background:var(--flag);color:var(--on-flag);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.04em}
.tag.dup{background:var(--surface-300);color:var(--ink)}
.btn:not(.btn--primary):not(.btn--flag):not(.btn--ghost){background:var(--surface-200)}

/* Signals */
.sigwrap{display:flex;justify-content:center}
.sig{display:block;max-width:100%;height:auto;border:2px solid var(--ink);border-radius:var(--radius-md);background:var(--surface-300)}
.sig--q{width:min(260px,100%)}
.sig--sm{width:120px;align-self:flex-start}
.opts.io{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans.io{flex-direction:column;align-items:stretch;padding:8px;gap:8px;text-align:center}
.ans.io .ans__key{align-self:flex-start}
.ans.io .sig--opt{width:100%;border-width:1px}
.ans.io .ans__status{justify-content:center}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 12px}
.scard{display:flex;flex-direction:column;gap:4px;padding:8px;border:2px solid var(--ink);border-radius:var(--radius-md);background:var(--surface-200)}
.scard .sig{width:100%;border-width:1px}
.scard__t{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:22px}
.seg{display:flex;gap:8px}
.seg__b{flex:1;min-height:44px;border:2px solid var(--line-strong);border-radius:var(--radius-pill);background:var(--surface-200);font-weight:600;cursor:pointer}

var KEY='gridiron-snap-oncesi-v2';
var S={xp:0,done:{},cards:{},packs:{rookie:1,playbook:0},correct:0,perfect:0};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);for(var k in p)S[k]=p[k]}}catch(e){}
/* Progress lives in localStorage and, for signed-in viewers, in a private per-person doc (data/users/<id>/progress) so it follows them across devices. */
var C={st:'local',ref:null,timer:null,pending:null,first:true};
var SYNC={local:'İlerlemen bu cihazda kayıtlı.',syncing:'Buluta kaydediliyor…',cloud:'Bulutta kayıtlı. Diğer cihazlarında da açılır.',error:'Buluta kaydedilemedi. Bu cihazda kayıtlı.',nowrite:'Yalnız bu cihazda kayıtlı. Bulut kaydı için antrenörden Contributor erişimi iste.'};
function setSync(st){C.st=st;var el=$('#sync');if(el)el.textContent=SYNC[st]}
function payload(){return {xp:S.xp,done:S.done,cards:S.cards,packs:S.packs,correct:S.correct,perfect:S.perfect,t:S.t||0}}
function push(){
  if(!C.ref)return;clearTimeout(C.timer);
  C.timer=setTimeout(function(){setSync('syncing');C.ref.set(payload()).then(function(){setSync('cloud')},function(){setSync('error')})},800);
}
function store(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.t=Date.now();store();push()}
function applyPending(){
  var d=C.pending;C.pending=null;if(!d)return;
  d=JSON.parse(JSON.stringify(d));
  ['xp','done','cards','packs','correct','perfect','t'].forEach(function(k){if(d[k]!=null)S[k]=d[k]});
  store();
}
function initCloud(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(r){
    var user=r[0],db=r[1];if(!user||!db)return;
    return user.id().then(function(uid){
      if(!uid)return;
      return Promise.resolve(user.can('data.write')).then(function(can){
        if(can===false){setSync('nowrite');return}
        C.ref=db.doc('data/users/'+uid+'/progress');
        setSync('syncing');
        C.ref.onSnapshot(function(snap){
          var d=snap.exists?snap.data():null,first=C.first;C.first=false;
          if(!d){push();return}
          var rt=d.t||0,lt=S.t||0;
          if(rt>lt){C.pending=d;if(V.screen==='tabs')render()}
          else if(rt<lt&&first)push();
          else setSync('cloud');
        },function(){setSync('error')});
      });
    });
  }).catch(function(){});
}

function lessonTotal(L){return L.count||(L.qs?L.qs.length:5)}
function lessonList(mod){
  var doneIn=Object.keys(S.done).filter(function(k){return LESSONS.some(function(L){return L.id===k&&(L.mod||1)===mod})}).length;
  return LESSONS.filter(function(L){return (L.mod||1)===mod}).map(function(L){
    var best=S.done[L.id],locked=L.need&&doneIn<L.need&&best==null;
    var state=locked?(g('lock',14)+' Kilitli'):(best!=null?best+' / '+lessonTotal(L):'Başla');
    return '<li><button class="lesson'+(best!=null?' is-done':'')+'" data-act="start" data-id="'+L.id+'"'+(locked?' disabled':'')+'><span class="lesson__n" aria-hidden="true">'+(best!=null?g('check',22):L.n)+'</span><span class="lesson__t"><strong>'+L.title+'</strong><span class="sm muted">'+(locked?L.need+' dersi bitirince açılır.':L.sub)+'</span></span><span class="lesson__state">'+state+'</span></button></li>';
  }).join('');
}

function viewPack(){
  var p=V.pack,lab=p.kind==='playbook'?'Playbook Paketi':'Rookie Paketi';
  if(p.state==='sealed'||p.state==='opening')return '<div class="stage"><p class="eyebrow">PAKET</p><h1 class="h-md">'+lab+'</h1><p class="muted">'+(p.kind==='playbook'?'5 sticker, en az biri 3 yıldız veya üstü.':'3 sticker.')+'</p>'+pack(p.kind,p.state)+
    '<button class="btn btn--flag btn--block" data-act="doopen"'+(p.state==='opening'?' disabled':'')+'>'+(p.state==='opening'?'Açılıyor…':'Aç')+'</button><button class="btn btn--ghost" data-act="home">Sonra aç</button></div>';
  var items=p.items,nw=items.filter(function(x){return !x.dup}).length,best=items.slice().sort(function(a,b){return b.c.stars-a.c.stars})[0].c;
  var f=FOULS.filter(function(x){return x.en===best.concept})[0];
  var grid=items.map(function(x){return '<div class="rv"><span class="tag'+(x.dup?' dup':'')+'">'+(x.dup?'TEKRAR +5 XP':'YENİ')+'</span>'+pcard(x.c,true,0)+'</div>'}).join('');
  return '<div class="stage"><p class="eyebrow">'+nw+' YENİ · '+(items.length-nw)+' TEKRAR</p><div class="revgrid">'+grid+'</div>'+
   (f?'<div class="fb" style="width:100%;text-align:left"><span class="eyebrow">EN İYİ STICKER: '+esc(best.name.toUpperCase())+' · '+best.stars+' YILDIZ</span><strong class="h-md" lang="en">'+f.en+'</strong><p>'+esc(f.note)+'</p><span class="fb__src">'+f.ref+'</span></div>':'')+
   ((S.packs[p.kind]>0)?'<button class="btn btn--flag btn--block" data-act="openpack" data-k="'+p.kind+'">Bir paket daha aç</button>':'')+'<button class="btn btn--block" data-act="gocoll">Albüme git</button><button class="btn btn--ghost" data-act="home">Derslere dön</button></div>';
}

function render(){
  if(C.pending&&V.screen==='tabs'){applyPending();setSync('cloud')}
  var m=$('#main'),html='';
  if(V.screen==='quiz')html=viewQuiz();else if(V.screen==='result')html=viewResult();else if(V.screen==='pack')html=viewPack();
  else html={learn:viewLearn,collection:viewCollection,glossary:viewGlossary,badges:viewBadges}[V.tab]();
  m.innerHTML=html;
  var tabs=$('#tabs');tabs.hidden=V.screen!=='tabs';
  var T=[['learn','Öğren','book'],['collection','Albüm','cards'],['glossary','Sözlük','flag'],['badges','Rozetler','medal']];
  $('.tabs__in',tabs).innerHTML=T.map(function(t){return '<button class="tab" data-act="tab" data-t="'+t[0]+'"'+(V.tab===t[0]?' aria-current="page"':'')+'>'+g(t[2],22)+t[1]+'</button>'}).join('');
  window.scrollTo(0,0);
}

/* ---------- logic ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function startLesson(id){
  var L=LESSONS.filter(function(x){return x.id===id})[0];
  var qs=L.sig?genSignalQs(L):(L.from?pickFrom(L):L.qs).map(function(q){return {s:q.s,e:q.e,r:q.r,b:q.b,opts:shuffle(q.o.map(function(t,i){return {t:t,ok:i===0}}))}});
  V.quiz={L:L,qs:qs,i:0,picked:null,res:[],right:0};V.screen='quiz';render();
}
function pick(i){
  var z=V.quiz;if(z.picked!=null)return;
  z.picked=i;var ok=z.qs[z.i].opts[i].ok;z.res[z.i]=ok;if(ok){z.right++;S.xp+=10;S.correct++}
  save();render();
  var f=$('.fb');if(f&&f.scrollIntoView)f.scrollIntoView({block:'nearest',behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
}
function finish(){
  var z=V.quiz,total=z.qs.length,right=z.right,before=lvIndex(S.xp-right*10),bBefore=badgesEarned();
  var bonus=20+(right===total?10:0);S.xp+=bonus;
  var pk=right===total?'playbook':right>=Math.ceil(total*.6)?'rookie':null;
  if(pk)S.packs[pk]++;
  if(right===total)S.perfect++;
  var prev=S.done[z.L.id];if(prev==null||right>prev)S.done[z.L.id]=right;
  var after=lvIndex(S.xp),nb=badgesEarned().filter(function(x){return bBefore.indexOf(x)<0}).map(function(id){return BADGES.filter(function(b){return b.id===id})[0].t});
  save();
  V.result={right:right,total:total,xp:right*10+bonus,pack:pk,levelUp:after>before?LEVELS[after].n:null,newBadges:nb};
  V.screen='result';render();
}
var DIST={rookie:[30,35,22,10,3],playbook:[10,25,35,22,8]};
function drawOne(kind,min){
  var d=DIST[kind],st=1,tries=0;
  do{var x=Math.random()*100,k=0;for(k=0;k<5;k++){if(x<d[k])break;x-=d[k]}st=Math.min(k+1,5);tries++}while(st<min&&tries<50);
  if(st<min)st=min;
  var pool=CARDS.filter(function(c){return c.stars===st}),fresh=pool.filter(function(c){return !S.cards[c.id]});
  var use=(fresh.length&&Math.random()<0.6)?fresh:pool;return use[Math.floor(Math.random()*use.length)];
}
function toPack(kind){if(!S.packs[kind])return;V.pack={kind:kind,state:'sealed'};V.screen='pack';render()}
function doOpen(){
  var p=V.pack;if(p.state!=='sealed')return;
  p.state='opening';render();
  var wait=window.matchMedia('(prefers-reduced-motion:reduce)').matches?150:900;
  setTimeout(function(){
    S.packs[p.kind]--;var n=p.kind==='playbook'?5:3,items=[];
    for(var i=0;i<n;i++){var c=drawOne(p.kind,(p.kind==='playbook'&&i===0)?3:1),dup=!!S.cards[c.id];S.cards[c.id]=(S.cards[c.id]||0)+1;if(dup)S.xp+=5;items.push({c:c,dup:dup})}
    save();V.pack={kind:p.kind,state:'open',items:items};render();
  },wait);
}
function copyTrade(){
  var dups=CARDS.filter(function(c){return S.cards[c.id]>1}),miss=CARDS.filter(function(c){return !S.cards[c.id]});
  var text='Takas listem\nFazlalarım: '+(dups.length?dups.map(function(c){return '#'+c.no+' '+c.name}).join(', '):'yok')+'\nEksiklerim: '+(miss.length?miss.map(function(c){return '#'+c.no}).join(', '):'yok');
  var out=$('#copyout');
  function fallback(){out.textContent=text}
  try{navigator.clipboard.writeText(text).then(function(){out.textContent='Kopyalandı.'},fallback)}catch(e){fallback()}
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-act');
  if(a==='tab'){V.tab=b.getAttribute('data-t');V.screen='tabs';render()}
  else if(a==='gl'){V.gl=b.getAttribute('data-v');render()}
  else if(a==='start')startLesson(b.getAttribute('data-id'));
  else if(a==='pick')pick(+b.getAttribute('data-i'));
  else if(a==='next'){var z=V.quiz;if(z.i===z.qs.length-1)finish();else{z.i++;z.picked=null;render()}}
  else if(a==='quit'){V.screen='tabs';V.tab='learn';render()}
  else if(a==='home'){V.screen='tabs';V.tab='learn';render()}
  else if(a==='gocoll'){V.screen='tabs';V.tab='collection';render()}
  else if(a==='openpack')toPack(b.getAttribute('data-k'));
  else if(a==='doopen')doOpen();
  else if(a==='copy')copyTrade();
  else if(a==='term'){
    var i=+b.getAttribute('data-i'),t=TERMS[i],open=b.getAttribute('aria-pressed')==='true';
    var all=document.querySelectorAll('#terms .term');for(var k=0;k<all.length;k++){all[k].setAttribute('aria-pressed','false');all[k].classList.remove('open')}
    if(!open){b.setAttribute('aria-pressed','true');b.classList.add('open');$('#termout').innerHTML='<strong lang="en">'+esc(t.en)+'</strong> '+esc(t.tr)}else $('#termout').textContent='';
  }
});
render();
initCloud();
})();
</script>
